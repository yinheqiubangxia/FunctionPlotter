"use strict";

/* =======================================================================
   1. 表达式解析（与 FunctionPlotter.Core/ExpressionParser.cs 一致的行为）
   ======================================================================= */

class ExprError extends Error {
  constructor(message, position) { super(message); this.position = position; }
}

const FUNCS1 = {
  sin: Math.sin, cos: Math.cos, tan: Math.tan,
  cot: x => 1 / Math.tan(x), sec: x => 1 / Math.cos(x), csc: x => 1 / Math.sin(x),
  asin: Math.asin, acos: Math.acos, atan: Math.atan,
  sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
  asinh: x => Math.asinh(x), acosh: x => Math.acosh(x), atanh: x => Math.atanh(x),
  exp: Math.exp, ln: Math.log, log: Math.log10, lg: Math.log10,
  log2: x => Math.log2(x), log10: Math.log10,
  sqrt: Math.sqrt, cbrt: Math.cbrt, abs: Math.abs, sign: Math.sign,
  floor: Math.floor, ceil: Math.ceil,
  round: x => Math.sign(x) * Math.round(Math.abs(x)),
  trunc: Math.trunc, frac: x => x - Math.trunc(x),
  rad: x => x * Math.PI / 180, deg: x => x * 180 / Math.PI
};
const FUNCS2 = {
  pow: Math.pow, atan2: Math.atan2, hypot: Math.hypot,
  max: Math.max, min: Math.min,
  mod: (a, b) => a - b * Math.floor(a / b),
  log: (a, b) => Math.log(a) / Math.log(b)
};
const CONSTS = { pi: Math.PI, "π": Math.PI, e: Math.E, tau: Math.PI * 2, phi: (1 + Math.sqrt(5)) / 2 };
const DIGIT_NAMES = new Set(["log2", "log10", "atan2"]);

function normalize(text) {
  let out = "";
  for (const ch of text) {
    switch (ch) {
      case "×": case "·": case "⋅": out += "*"; break;
      case "÷": out += "/"; break;
      case "−": case "–": case "—": out += "-"; break;
      case "（": out += "("; break;
      case "）": out += ")"; break;
      case "，": out += ","; break;
      case "＾": out += "^"; break;
      case "＋": out += "+"; break;
      case "\u00A0": case "\u3000": out += " "; break;
      default: out += ch;
    }
  }
  const eq = out.indexOf("=");
  if (eq >= 0) out = out.slice(eq + 1);
  return out;
}

const isLetter = ch => /[A-Za-z_π]/.test(ch);

function tokenize(src) {
  const tokens = [];
  let i = 0;
  while (i < src.length) {
    const c = src[i];
    if (/\s/.test(c)) { i++; continue; }

    if (/[0-9]/.test(c) || (c === "." && /[0-9]/.test(src[i + 1] || ""))) {
      const start = i;
      while (i < src.length && /[0-9]/.test(src[i])) i++;
      if (src[i] === ".") { i++; while (i < src.length && /[0-9]/.test(src[i])) i++; }
      if (src[i] === "e" || src[i] === "E") {
        const save = i; i++;
        if (src[i] === "+" || src[i] === "-") i++;
        if (/[0-9]/.test(src[i] || "")) { while (i < src.length && /[0-9]/.test(src[i])) i++; }
        else i = save;
      }
      const span = src.slice(start, i);
      const value = Number(span);
      if (!isFinite(value)) throw new ExprError(`无法识别的数字："${span}"`, start);
      tokens.push({ type: "num", value, text: span, pos: start });
      continue;
    }

    if (isLetter(c)) {
      const start = i;
      while (i < src.length && isLetter(src[i])) i++;
      let name = src.slice(start, i);
      while (i < src.length && /[0-9]/.test(src[i]) && DIGIT_NAMES.has(name + src[i])) {
        name += src[i]; i++;
      }
      tokens.push({ type: "id", text: name, pos: start });
      continue;
    }

    if ("+-*/^|".includes(c)) { tokens.push({ type: "op", sym: c, text: c, pos: i }); i++; continue; }
    if (c === "(") { tokens.push({ type: "lp", text: c, pos: i }); i++; continue; }
    if (c === ")") { tokens.push({ type: "rp", text: c, pos: i }); i++; continue; }
    if (c === ",") { tokens.push({ type: "comma", text: c, pos: i }); i++; continue; }

    throw new ExprError(`无法识别的字符："${c}"`, i);
  }
  tokens.push({ type: "end", text: "<结束>", pos: src.length });
  return tokens;
}

function compile(text) {
  const source = normalize(text || "");
  if (!source.trim()) throw new ExprError("请输入函数表达式", 0);

  const tokens = tokenize(source);
  let p = 0;
  const cur = () => tokens[p];
  const advance = () => tokens[p++];
  const isOp = sym => cur().type === "op" && cur().sym === sym;
  const matchOp = sym => { if (isOp(sym)) { p++; return true; } return false; };

  function parseExpr() {
    let left = parseTerm();
    for (;;) {
      if (matchOp("+")) left = { k: "bin", op: "+", a: left, b: parseTerm() };
      else if (matchOp("-")) left = { k: "bin", op: "-", a: left, b: parseTerm() };
      else return left;
    }
  }

  function startsFactor() {
    const t = cur().type;
    return t === "num" || t === "id" || t === "lp";
  }

  function parseTerm() {
    let left = parseUnary();
    for (;;) {
      if (matchOp("*")) left = { k: "bin", op: "*", a: left, b: parseUnary() };
      else if (matchOp("/")) left = { k: "bin", op: "/", a: left, b: parseUnary() };
      else if (startsFactor()) left = { k: "bin", op: "*", a: left, b: parseUnary() };
      else return left;
    }
  }

  function parseUnary() {
    if (matchOp("-")) return { k: "neg", a: parseUnary() };
    if (matchOp("+")) return parseUnary();
    return parsePower();
  }

  function parsePower() {
    const base = parseAtom();
    if (matchOp("^")) return { k: "bin", op: "^", a: base, b: parseUnary() };
    return base;
  }

  function parseAtom() {
    const t = cur();

    if (t.type === "num") { advance(); return { k: "num", v: t.value }; }

    if (t.type === "lp") {
      advance();
      const inner = parseExpr();
      if (cur().type !== "rp") throw new ExprError('缺少右括号 ")"', cur().pos);
      advance();
      return inner;
    }

    if (t.type === "op" && t.sym === "|") {
      advance();
      const inner = parseExpr();
      if (!(cur().type === "op" && cur().sym === "|")) throw new ExprError('绝对值缺少收尾的 "|"', cur().pos);
      advance();
      return { k: "fn1", f: Math.abs, a: inner };
    }

    if (t.type === "id") {
      const name = t.text;
      advance();
      const isCall = cur().type === "lp";
      const lower = name.toLowerCase();
      if (isCall && (FUNCS1[lower] || FUNCS2[lower])) return parseCall(lower, t.pos);
      if (lower === "x") return { k: "x" };
      if (Object.prototype.hasOwnProperty.call(CONSTS, lower) || Object.prototype.hasOwnProperty.call(CONSTS, name)) {
        if (isCall) throw new ExprError(`"${name}" 不是函数`, t.pos);
        return { k: "num", v: CONSTS[lower] !== undefined ? CONSTS[lower] : CONSTS[name] };
      }
      const hint = closestFunction(lower);
      throw new ExprError(hint ? `未知的函数或变量："${name}"（是不是 ${hint}？）` : `未知的函数或变量："${name}"`, t.pos);
    }

    if (t.type === "rp") throw new ExprError("多了个右括号，或运算符缺失", t.pos);
    if (t.type === "end") throw new ExprError("表达式不完整，后面还需要内容", t.pos);
    throw new ExprError(`这里需要一个数值、变量或函数，而不是 "${t.text}"`, t.pos);
  }

  function parseCall(name, pos) {
    advance(); // (
    const args = [];
    if (cur().type !== "rp") {
      args.push(parseExpr());
      while (cur().type === "comma") { advance(); args.push(parseExpr()); }
    }
    if (cur().type !== "rp") throw new ExprError(`函数 ${name}( ) 缺少右括号`, cur().pos);
    advance();

    if (FUNCS1[name] && args.length === 1) return { k: "fn1", f: FUNCS1[name], a: args[0] };
    if (FUNCS2[name] && args.length === 2) return { k: "fn2", f: FUNCS2[name], a: args[0], b: args[1] };
    if (name === "log" && args.length === 1) return { k: "fn1", f: Math.log10, a: args[0] };

    const want = FUNCS2[name] ? (FUNCS1[name] ? "1 个或 2 个" : "2 个") : "1 个";
    throw new ExprError(`函数 ${name} 需要 ${want}参数，实际给了 ${args.length} 个`, cur().pos);
  }

  function closestFunction(name) {
    let best = null, bestD = 99;
    for (const key of Object.keys(FUNCS1)) {
      const d = levenshtein(name, key);
      if (d < bestD) { bestD = d; best = key; }
    }
    return bestD <= 2 ? best : null;
  }

  const root = parseExpr();
  if (cur().type !== "end") {
    if (cur().type === "rp") throw new ExprError("多余的右括号", cur().pos);
    throw new ExprError(`这里看不懂："${cur().text}"`, cur().pos);
  }

  return {
    text: source.trim(),
    eval(x) { return evalNode(root, x); }
  };
}

function evalNode(n, x) {
  switch (n.k) {
    case "num": return n.v;
    case "x": return x;
    case "neg": return -evalNode(n.a, x);
    case "fn1": return n.f(evalNode(n.a, x));
    case "fn2": return n.f(evalNode(n.a, x), evalNode(n.b, x));
    case "bin": {
      const a = evalNode(n.a, x), b = evalNode(n.b, x);
      switch (n.op) {
        case "+": return a + b;
        case "-": return a - b;
        case "*": return a * b;
        case "/": return a / b;
        case "^": return Math.pow(a, b);
      }
    }
  }
  return NaN;
}

function levenshtein(a, b) {
  const prev = new Array(b.length + 1), cur = new Array(b.length + 1);
  for (let j = 0; j <= b.length; j++) prev[j] = j;
  for (let i = 1; i <= a.length; i++) {
    cur[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      cur[j] = Math.min(cur[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost);
    }
    for (let j = 0; j <= b.length; j++) prev[j] = cur[j];
  }
  return prev[b.length];
}

/* =======================================================================
   2. 视口与刻度
   ======================================================================= */

const vp = { xMin: -10, xMax: 10, yMin: -6, yMax: 6 };

const vpWidth = () => vp.xMax - vp.xMin;
const vpHeight = () => vp.yMax - vp.yMin;
const toPxX = (x, w) => (x - vp.xMin) / vpWidth() * w;
const toPxY = (y, h) => h - (y - vp.yMin) / vpHeight() * h;
const toWorldX = (px, w) => vp.xMin + px / w * vpWidth();
const toWorldY = (py, h) => vp.yMin + (h - py) / h * vpHeight();

function niceStep(raw) {
  if (!(raw > 0) || !isFinite(raw)) return 1;
  const exp = Math.floor(Math.log10(raw));
  const mag = Math.pow(10, exp);
  const f = raw / mag;
  const nice = f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10;
  return nice * mag;
}

function ticks(min, max, step) {
  const out = [];
  if (!(step > 0) || !(max > min)) return out;
  let v = Math.ceil(min / step) * step;
  for (let guard = 0; v <= max + step * 1e-6 && guard < 200; guard++, v += step) {
    out.push(Math.abs(v) < step * 1e-9 ? 0 : v);
  }
  return out;
}

function formatTick(value, step) {
  if (Math.abs(value) < step * 1e-9) return "0";
  const abs = Math.abs(value);
  if (abs >= 1e6 || abs < 1e-4) {
    return value.toExponential(1).replace("e+", "e").replace("e-", "e-");
  }
  const decimals = step >= 1 ? 0 : Math.min(6, Math.ceil(-Math.log10(step)));
  return value.toFixed(Math.max(0, decimals));
}

/* =======================================================================
   3. 采样（渐近线断点）
   ======================================================================= */

function sample(expr, count) {
  const segments = [];
  let current = [];
  const span = Math.max(vpHeight(), 1e-9);
  const guard = Math.max(Math.abs(vp.yMin), Math.abs(vp.yMax), span) * 4 + 1;
  const step = vpWidth() / (count - 1);
  let prevY = NaN, hasPrev = false;

  const flush = () => { if (current.length >= 2) segments.push(current); current = []; };

  for (let i = 0; i < count; i++) {
    const x = i === count - 1 ? vp.xMax : vp.xMin + step * i;
    const y = expr.eval(x);

    if (!isFinite(y)) { flush(); hasPrev = false; continue; }

    if (hasPrev) {
      const crosses = (prevY > vp.yMax && y < vp.yMin) || (prevY < vp.yMin && y > vp.yMax);
      const jump = Math.abs(y - prevY) > guard * 2;
      if (crosses || jump) flush();
    }

    current.push({ x, y: Math.max(-guard, Math.min(guard, y)) });
    prevY = y; hasPrev = true;
  }
  flush();
  return segments;
}

function estimateYRange(expr, count) {
  const values = [];
  const step = vpWidth() / (count - 1);
  for (let i = 0; i < count; i++) {
    const y = expr.eval(vp.xMin + step * i);
    if (!isFinite(y) || Math.abs(y) > 1e12) continue;
    values.push(y);
  }
  if (values.length < 8) return null;
  values.sort((a, b) => a - b);

  const pct = q => {
    const pos = q * (values.length - 1);
    const i = Math.floor(pos), f = pos - i;
    return i >= values.length - 1 ? values[values.length - 1] : values[i] * (1 - f) + values[i + 1] * f;
  };

  let low = pct(0.04), high = pct(0.96);
  if (!(high > low)) {
    const c = values[Math.floor(values.length / 2)];
    low = c - 1; high = c + 1;
  }
  const pad = (high - low) * 0.12;
  low -= pad; high += pad;

  const height = high - low;
  if (low > 0 && low < height * 0.35) low = 0;
  if (high < 0 && -high < height * 0.35) high = 0;
  if (!(high > low)) { low -= 1; high += 1; }
  return [low, high];
}

/* =======================================================================
   4. 绘制
   ======================================================================= */

const canvas = document.getElementById("plot");
const ctx = canvas.getContext("2d");
const wrap = document.getElementById("plotwrap");
const readout = document.getElementById("readout");
const statusEl = document.getElementById("status");
const fnInput = document.getElementById("fn");

let expr = null;
let errorMessage = "";
let segments = [];
let pointer = null;
let dragging = false;
let lastPoint = null;
let cssW = 0, cssH = 0;

function themeColors() {
  const cs = getComputedStyle(document.documentElement);
  const v = k => cs.getPropertyValue(k).trim();
  return {
    plotBg: v("--plot-bg"), grid: v("--grid"), axis: v("--axis"),
    tick: v("--tick"), accent: v("--accent"), text3: v("--text-3")
  };
}

function resizeCanvas() {
  const rect = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cssW = Math.max(1, rect.width);
  cssH = Math.max(1, rect.height);
  const w = Math.round(cssW * dpr), h = Math.round(cssH * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h;
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function draw() {
  resizeCanvas();
  const w = cssW, h = cssH;
  const C = themeColors();

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = C.plotBg;
  ctx.fillRect(0, 0, w, h);

  const xStep = niceStep(vpWidth() / Math.max(3, Math.round(w / 80)));
  const yStep = niceStep(vpHeight() / Math.max(3, Math.round(h / 58)));

  const axisX = toPxX(0, w), axisY = toPxY(0, h);
  const axisXVisible = axisX >= 0 && axisX <= w;
  const axisYVisible = axisY >= 0 && axisY <= h;

  // 网格
  ctx.lineWidth = 1;
  ctx.strokeStyle = C.grid;
  ctx.beginPath();
  for (const value of ticks(vp.xMin, vp.xMax, xStep)) {
    const px = Math.round(toPxX(value, w)) + 0.5;
    if (px < 0 || px > w) continue;
    ctx.moveTo(px, 0); ctx.lineTo(px, h);
  }
  for (const value of ticks(vp.yMin, vp.yMax, yStep)) {
    const py = Math.round(toPxY(value, h)) + 0.5;
    if (py < 0 || py > h) continue;
    ctx.moveTo(0, py); ctx.lineTo(w, py);
  }
  ctx.stroke();

  // 坐标轴
  ctx.strokeStyle = C.axis;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  if (axisXVisible) { const x = Math.round(axisX) + 0.5; ctx.moveTo(x, 0); ctx.lineTo(x, h); }
  if (axisYVisible) { const y = Math.round(axisY) + 0.5; ctx.moveTo(0, y); ctx.lineTo(w, y); }
  ctx.stroke();

  // 刻度文字
  ctx.fillStyle = C.tick;
  ctx.font = "11px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif";
  ctx.textBaseline = "top";
  ctx.textAlign = "center";

  const labelTop = axisYVisible ? Math.min(axisY + 5, h - 17) : (axisY > h ? h - 17 : 4);
  for (const value of ticks(vp.xMin, vp.xMax, xStep)) {
    const px = toPxX(value, w);
    if (px < 16 || px > w - 12) continue;
    ctx.fillText(formatTick(value, xStep), px, labelTop);
  }

  const labelLeft = axisXVisible ? Math.min(axisX + 6, w - 44) : (axisX > w ? w - 46 : 5);
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  for (const value of ticks(vp.yMin, vp.yMax, yStep)) {
    const py = toPxY(value, h);
    if (py < 10 || py > h - 16) continue;
    // 原点已经由 X 轴的 "0" 标出，这里跳过避免重叠
    if (value === 0 && axisXVisible) continue;
    ctx.fillText(formatTick(value, yStep), labelLeft, py);
  }

  // 曲线
  ctx.strokeStyle = C.accent;
  ctx.lineWidth = 2;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  for (const seg of segments) {
    ctx.beginPath();
    for (let i = 0; i < seg.length; i++) {
      const px = toPxX(seg[i].x, w), py = toPxY(seg[i].y, h);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }

  // 十字光标
  if (pointer && !dragging) {
    ctx.save();
    ctx.strokeStyle = C.text3;
    ctx.globalAlpha = 0.55;
    ctx.setLineDash([4, 4]);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(Math.round(pointer.x) + 0.5, 0);
    ctx.lineTo(Math.round(pointer.x) + 0.5, h);
    ctx.moveTo(0, Math.round(pointer.y) + 0.5);
    ctx.lineTo(w, Math.round(pointer.y) + 0.5);
    ctx.stroke();
    ctx.restore();
  }

  updateReadout(w, h);
}

function updateReadout(w, h) {
  if (!pointer || dragging) { readout.classList.remove("on"); return; }

  const worldX = toWorldX(pointer.x, w);
  const worldY = toWorldY(pointer.y, h);
  let line2;
  if (expr) {
    const y = expr.eval(worldX);
    line2 = isFinite(y) ? "f(x) = " + fmt(y) : "f(x) = 无定义";
  } else {
    line2 = "f(x) = —";
  }

  readout.textContent = "x = " + fmt(worldX) + "\n" + line2;

  const pad = 16;
  let left = pointer.x + pad;
  let top = pointer.y + pad;
  const rw = readout.offsetWidth, rh = readout.offsetHeight;
  if (left + rw > w - 4) left = pointer.x - rw - pad;
  if (top + rh > h - 4) top = pointer.y - rh - pad;
  readout.style.left = Math.max(4, left) + "px";
  readout.style.top = Math.max(4, top) + "px";
  readout.classList.add("on");
}

function fmt(v) {
  if (!isFinite(v)) return "—";
  const abs = Math.abs(v);
  if (abs !== 0 && (abs < 1e-4 || abs >= 1e6)) return v.toExponential(3);
  return (Math.round(v * 1e4) / 1e4).toString();
}

/* =======================================================================
   5. 交互与状态
   ======================================================================= */

function refresh(resample = true) {
  if (resample) {
    if (expr) {
      resizeCanvas();
      const count = Math.max(240, Math.min(4000, Math.round(cssW * 1.8)));
      segments = sample(expr, count);
    } else {
      segments = [];
    }
  }
  draw();
  updateStatus();
}

function updateStatus() {
  if (errorMessage) {
    statusEl.textContent = errorMessage;
    statusEl.classList.add("error");
    return;
  }
  statusEl.classList.remove("error");
  if (!expr) {
    statusEl.textContent = "输入一个关于 x 的表达式";
    return;
  }
  statusEl.textContent = `已绘制 · x ∈ [${fmt(vp.xMin)}, ${fmt(vp.xMax)}] · y ∈ [${fmt(vp.yMin)}, ${fmt(vp.yMax)}]`;
}

function setExpression(text) {
  try {
    expr = compile(text);
    errorMessage = "";
  } catch (e) {
    expr = null;
    errorMessage = e instanceof ExprError ? e.message : String(e);
  }
  segments = [];
  refresh();
}

function fitView() {
  if (expr) {
    const range = estimateYRange(expr, 1200);
    if (range) { vp.yMin = range[0]; vp.yMax = range[1]; }
  } else {
    vp.yMin = -6; vp.yMax = 6;
  }
  refresh(true);
}

function resetView() {
  vp.xMin = -10; vp.xMax = 10; vp.yMin = -6; vp.yMax = 6;
  if (expr) {
    const range = estimateYRange(expr, 1200);
    if (range) { vp.yMin = range[0]; vp.yMax = range[1]; }
  }
  refresh(true);
}

function zoomAt(factor, ax, ay) {
  const nx1 = ax + (vp.xMin - ax) * factor;
  const nx2 = ax + (vp.xMax - ax) * factor;
  const ny1 = ay + (vp.yMin - ay) * factor;
  const ny2 = ay + (vp.yMax - ay) * factor;
  if (nx2 - nx1 < 1e-9 || ny2 - ny1 < 1e-9) return;
  vp.xMin = nx1; vp.xMax = nx2; vp.yMin = ny1; vp.yMax = ny2;
  refresh(true);
}

function localPoint(ev) {
  const rect = canvas.getBoundingClientRect();
  return { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
}

canvas.addEventListener("pointerdown", ev => {
  if (ev.button !== 0) return;
  dragging = true;
  lastPoint = localPoint(ev);
  pointer = lastPoint;
  canvas.setPointerCapture(ev.pointerId);
  readout.classList.remove("on");
});

canvas.addEventListener("pointermove", ev => {
  const p = localPoint(ev);
  pointer = p;
  if (dragging && lastPoint) {
    const dx = -(p.x - lastPoint.x) / cssW * vpWidth();
    const dy = (p.y - lastPoint.y) / cssH * vpHeight();
    vp.xMin += dx; vp.xMax += dx; vp.yMin += dy; vp.yMax += dy;
    lastPoint = p;
    refresh(true);
    return;
  }
  draw();
});

canvas.addEventListener("pointerup", ev => {
  dragging = false;
  lastPoint = null;
  try { canvas.releasePointerCapture(ev.pointerId); } catch (_) {}
  draw();
});

canvas.addEventListener("pointerleave", () => {
  if (dragging) return;
  pointer = null;
  readout.classList.remove("on");
  draw();
});

canvas.addEventListener("pointercancel", () => { dragging = false; lastPoint = null; });

canvas.addEventListener("wheel", ev => {
  ev.preventDefault();
  const p = localPoint(ev);
  const factor = ev.deltaY < 0 ? 0.88 : 1 / 0.88;
  zoomAt(factor, toWorldX(p.x, cssW), toWorldY(p.y, cssH));
  pointer = p;
}, { passive: false });

canvas.addEventListener("dblclick", () => fitView());

fnInput.addEventListener("input", () => setExpression(fnInput.value));

document.getElementById("fitBtn").addEventListener("click", () => fitView());

/* ---- 菜单 ---- */
const flyout = document.getElementById("flyout");
const moreBtn = document.getElementById("moreBtn");

moreBtn.addEventListener("click", ev => {
  ev.stopPropagation();
  flyout.classList.toggle("open");
});

document.addEventListener("click", ev => {
  if (!flyout.contains(ev.target)) flyout.classList.remove("open");
});

flyout.addEventListener("click", ev => {
  const item = ev.target.closest(".mi");
  if (!item) return;

  if (item.dataset.ex) {
    fnInput.value = item.dataset.ex;
    setExpression(item.dataset.ex);
    fitView();
  } else if (item.dataset.act) {
    const act = item.dataset.act;
    if (act === "fit") fitView();
    if (act === "reset") resetView();
    if (act === "zin") zoomAt(0.8, (vp.xMin + vp.xMax) / 2, (vp.yMin + vp.yMax) / 2);
    if (act === "zout") zoomAt(1.25, (vp.xMin + vp.xMax) / 2, (vp.yMin + vp.yMax) / 2);
  }
  flyout.classList.remove("open");
});

document.addEventListener("keydown", ev => {
  if (!(ev.ctrlKey || ev.metaKey)) return;
  const k = ev.key;
  if (k === "+" || k === "=") { ev.preventDefault(); zoomAt(0.8, (vp.xMin + vp.xMax) / 2, (vp.yMin + vp.yMax) / 2); }
  else if (k === "-") { ev.preventDefault(); zoomAt(1.25, (vp.xMin + vp.xMax) / 2, (vp.yMin + vp.yMax) / 2); }
  else if (k.toLowerCase() === "r") { ev.preventDefault(); resetView(); }
  else if (k.toLowerCase() === "f") { ev.preventDefault(); fitView(); }
});

/* ---- 主题 ---- */
const themeBtn = document.getElementById("themeBtn");
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  themeBtn.textContent = theme === "dark" ? "☀" : "◐";
  draw();
}
const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");
applyTheme(prefersDark.matches ? "dark" : "light");
prefersDark.addEventListener("change", e => applyTheme(e.matches ? "dark" : "light"));
themeBtn.addEventListener("click", () => {
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
});

/* ---- 启动 ---- */
new ResizeObserver(() => { resizeCanvas(); refresh(true); }).observe(wrap);

resizeCanvas();
setExpression(fnInput.value);
if (expr) {
  const range = estimateYRange(expr, 1200);
  if (range) { vp.yMin = range[0]; vp.yMax = range[1]; }
  refresh(true);
}
</script>
</body>
</html>
